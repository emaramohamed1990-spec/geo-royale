<style>
/* Layout: one-screen game — top bar, lesson chips, a big flip card in the middle, big thumb buttons under it */
:root {
  --sky: #cfeaff; --sand: #ffd66b; --nile: #1d4f91; --ink: #1c2740; --paper: #ffffff; --soft: #f3f8ff;
  --good: #1e9e5a; --again: #e0662b;
  --display: 'Lalezar', 'Cairo', Tahoma, sans-serif; --body: 'Cairo', Tahoma, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; font-family: var(--body); color: var(--ink);
  background: linear-gradient(180deg, var(--sky) 0%, #eaf6ff 55%, var(--sand) 100%);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.app { max-width: 760px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; gap: 12px; padding-block: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 38px); margin: 0; color: var(--nile); line-height: 1.1; }
.stars { background: var(--paper); border-radius: 999px; padding: 6px 16px; font-weight: 900; font-size: 18px; box-shadow: 0 3px 0 rgba(29,79,145,.18); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 3px solid var(--c, var(--nile)); background: var(--paper); color: var(--ink); font: 700 15px var(--body); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--c, var(--nile)); color: #fff; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mode { border: none; border-radius: 16px; padding: 10px 6px; font: 400 clamp(17px, 3.4vw, 22px) var(--display); background: var(--paper); color: var(--nile); cursor: pointer; box-shadow: 0 4px 0 rgba(29,79,145,.2); }
.mode[aria-pressed="true"] { background: var(--nile); color: #fff; }
.mode small { display: block; font: 600 12px var(--body); opacity: .75; }
.status { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; color: var(--nile); min-height: 26px; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 10px; background: rgba(255,255,255,.7); border-radius: 99px; margin-inline: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .3s; }
.stage { flex: 1; min-height: 280px; perspective: 1400px; display: flex; }
.card { position: relative; flex: 1; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,1.3,.5,1); cursor: pointer; }
.card.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 28px; background: var(--paper);
  border: 6px solid var(--c); box-shadow: 0 10px 0 color-mix(in srgb, var(--c) 45%, transparent), 0 18px 40px rgba(28,39,64,.15);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 26px 22px; gap: 12px; overflow: auto; }
.front { background: color-mix(in srgb, var(--c) 10%, var(--paper)); }
.back { transform: rotateY(180deg); }
.tag { position: absolute; top: 14px; right: 16px; background: var(--c); color: #fff; font-weight: 700; font-size: 14px; padding: 2px 14px; border-radius: 99px; }
.face .no { position: absolute; top: 16px; left: 18px; font-weight: 700; color: color-mix(in srgb, var(--ink) 50%, transparent); font-variant-numeric: tabular-nums; }
.emo { font-size: clamp(60px, 13vw, 96px); line-height: 1; }
.q { font-family: var(--display); font-size: clamp(24px, 5vw, 38px); line-height: 1.35; text-wrap: balance; }
.hint { font-size: 14px; color: color-mix(in srgb, var(--ink) 55%, transparent); }
.a { font-size: clamp(20px, 3.8vw, 28px); line-height: 1.7; font-weight: 600; text-wrap: balance; }
.a b { color: var(--c); font-weight: 900; }
.tk { background: #fff1a8; border-radius: 16px; padding: 8px 16px; font-size: clamp(16px, 3vw, 21px); line-height: 1.6; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: env(safe-area-inset-bottom, 0px); }
.btn { border: none; border-radius: 20px; padding: 16px 10px; font: 400 clamp(20px, 4vw, 26px) var(--display); color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.btn.good { background: var(--good); } .btn.again { background: var(--again); } .btn.nav { background: var(--nile); }
.btn:focus-visible, .chip:focus-visible, .mode:focus-visible, .card:focus-visible { outline: 4px solid var(--nile); outline-offset: 3px; }
.done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: var(--paper); border-radius: 28px; border: 6px solid var(--sand); padding: 24px; gap: 10px; }
.done .big { font-size: 90px; line-height: 1; }
.done h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 44px); margin: 0; color: var(--nile); }
.done p { font-size: 19px; margin: 0; }
.timer { font-family: var(--display); font-size: 26px; color: var(--again); font-variant-numeric: tabular-nums; }
.burst { position: fixed; pointer-events: none; font-size: 34px; animation: fly 1s ease-out forwards; z-index: 9; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(40deg); opacity: 0; } }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: rgba(255,255,255,.6); padding: 5px; border-radius: 20px; }
.tab { border: none; border-radius: 16px; padding: 10px; font: 400 clamp(20px, 4vw, 26px) var(--display); background: transparent; color: var(--nile); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--nile); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.tab:focus-visible, .tile:focus-visible, .zoomable:focus-visible { outline: 4px solid var(--nile); outline-offset: 3px; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; overflow: auto; padding: 4px 2px 8px; align-content: start; }
.tile { border: 5px solid var(--c); background: var(--paper); border-radius: 24px; padding: 16px 12px; cursor: pointer; text-align: center; font-family: var(--body); color: var(--ink);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 40%, transparent); display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.tile .te { font-size: clamp(44px, 9vw, 64px); line-height: 1.1; }

.intro { background: var(--paper); border-radius: 20px; padding: 10px 16px; font-size: 16px; line-height: 1.7; font-weight: 600; }
.lhead { display: flex; align-items: center; gap: 10px; }
.back-btn { border: none; background: var(--paper); color: var(--nile); font: 700 16px var(--body); border-radius: 99px; padding: 6px 14px; cursor: pointer; box-shadow: 0 3px 0 rgba(29,79,145,.18); flex: none; }
.lname { font: 400 clamp(22px, 4.4vw, 30px) var(--display); color: var(--c); flex: 1; min-width: 0; }
.dots { display: flex; gap: 5px; flex: none; }
.dots i { width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,.9); border: 2px solid var(--c); }
.dots i.on { background: var(--c); }
.slide { flex: 1; min-height: 0; overflow: auto; background: var(--paper); border-radius: 28px; border: 6px solid var(--c); padding: 18px 20px 22px;
  box-shadow: 0 8px 0 color-mix(in srgb, var(--c) 40%, transparent); display: flex; flex-direction: column; gap: 12px; }
.slide h2 { margin: 0; font: 400 clamp(26px, 5.4vw, 40px) var(--display); color: var(--c); text-wrap: balance; display: flex; align-items: center; gap: 10px; }
.slide h2 span { font-size: 1.2em; }
.zoomable { width: 100%; max-height: 46vh; object-fit: contain; border-radius: 18px; cursor: zoom-in; background: var(--soft); flex: none; }
.zhint { font-size: 13px; text-align: center; opacity: .6; margin-top: -6px; }
.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pts li { font-size: clamp(18px, 3.5vw, 24px); line-height: 1.65; background: color-mix(in srgb, var(--c) 8%, var(--paper)); border-radius: 14px; padding: 6px 14px; }
.pts b { color: var(--c); }
.strick { background: #fff1a8; border: 3px dashed #e3a600; border-radius: 18px; padding: 10px 16px; font-size: clamp(17px, 3.3vw, 22px); line-height: 1.7; }
.strick::before { content: '💡 الحيلة: '; font-weight: 900; color: #b45f00; }
.svgbox svg { width: 100%; height: auto; }
.minis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mini { text-align: center; background: var(--soft); border-radius: 14px; padding: 6px; font-size: 14px; }
.mini svg { width: 100%; height: auto; display: block; }
.zoom { position: fixed; inset: 0; background: rgba(12,20,40,.92); z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.zoom img { max-width: 100%; max-height: 100%; border-radius: 16px; }
.zoom button { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); border: none; border-radius: 99px; background: #fff; color: #1c2740; font: 700 18px var(--body); padding: 8px 16px; }
@media (max-width: 520px) { .minis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.tabs { grid-template-columns: repeat(3, 1fr); }

.qles { font-weight: 700; font-size: 14px; opacity: .7; }
.qemo { font-size: clamp(48px, 10vw, 72px); text-align: center; line-height: 1.1; }

.elabel { font-weight: 900; font-size: 15px; margin-bottom: 4px; opacity: .85; }
.easy { background: #e8f4ff; border-radius: 18px; padding: 10px 16px; font-size: clamp(18px, 3.4vw, 23px); line-height: 1.75; }
.how { background: color-mix(in srgb, var(--c) 10%, var(--paper)); border-radius: 14px; padding: 8px 14px; font-size: clamp(15px, 2.9vw, 18px); line-height: 1.6; }
.eans { background: #eafaf0; border: 3px solid var(--good); border-radius: 18px; padding: 10px 16px; font-size: clamp(19px, 3.6vw, 25px); line-height: 1.8; font-weight: 600; }
.eans b { color: var(--good); font-weight: 900; }

.tabs { grid-template-columns: repeat(4, 1fr); }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { border: 3px solid color-mix(in srgb, var(--c) 35%, transparent); background: var(--paper); border-radius: 18px; padding: 12px 16px; font: 600 clamp(17px, 3.3vw, 22px) var(--body); color: var(--ink); text-align: right; line-height: 1.6; cursor: pointer; }
.opt.right, .mq.right, .ma.right { background: #dff6e8; border-color: var(--good); }

.gmapwrap { background: var(--paper); border-radius: 20px; padding: 8px 14px; border: 4px solid var(--gc, var(--nile)); }
.gmapwrap summary { font: 400 clamp(19px, 3.6vw, 24px) var(--display); color: var(--gc, var(--nile)); cursor: pointer; }
.gmap { margin: 8px 0 4px; font-size: clamp(15px, 2.9vw, 19px); line-height: 1.6; }

.gnote { background: #f1e6ff; border-radius: 14px; padding: 8px 14px; font-size: clamp(16px, 3vw, 20px); line-height: 1.6; }

.tabs { grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tab { font-size: clamp(14px, 3vw, 22px); padding: 9px 2px; }

.mapbox svg { width: 100%; height: 100%; display: block; touch-action: manipulation; }

.rlab { font: 400 15px var(--display); paint-order: stroke; stroke: #fff; stroke-width: 4px; pointer-events: none; }
.sea { font: 700 11px var(--body); fill: #1d4f91; pointer-events: none; }
.mlab { font-family: var(--body); font-weight: 900; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 3px; pointer-events: none; }
.mspot { cursor: pointer; }
.mspot.on circle { stroke-width: 5; fill: #fff3b0; }
.mspot.right circle { fill: #c8f2d6; stroke: var(--good); stroke-width: 5; }
.mspot.wrong circle { fill: #ffd8c8; stroke: var(--again); }
.shake { animation: shake .35s; }
.compass { pointer-events: none; }
.mpanel { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; }
.mcard { background: var(--paper); border-radius: 22px; border: 5px solid var(--c); padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.minfo { font-size: clamp(18px, 3.4vw, 23px); line-height: 1.7; }
.minfo b { color: var(--c); }
.mh { margin: 4px 0 0; font: 400 clamp(19px, 3.6vw, 24px) var(--display); color: var(--c); }
.mchips { display: flex; flex-wrap: wrap; gap: 8px; }
.mqs { display: flex; flex-direction: column; gap: 8px; }
.mq-item { background: color-mix(in srgb, var(--c) 7%, var(--paper)); border-radius: 16px; padding: 8px 12px; }

.qtype.small { font-size: 13px; padding: 1px 10px; vertical-align: middle; }
.mgame { background: var(--paper); border-radius: 22px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

.mmode { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    document.body.appendChild(s); setTimeout(() => s.remove(), 4000);
  }
}
function royBind() {
  const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  document.querySelectorAll('[data-ro]').forEach(b => b.onclick = () => {
    if (roy.answered) return; const o = roy.q.opts[+b.dataset.ro], ok = o === roy.q.ans;
    royAnswer(ok, roy.q.ans); if (ok) addStars(1, $('stars'));
  });
  on('rnext', () => { roy.i++; if (roy.i >= roy.qs.length) { roy.done = true; if (roy.correct === 10) confetti(50); } else { roy.q = roy.qs[roy.i]; roy.answered = false; roy.fb = ''; roy.mark = {}; mMode = roy.q.view; } drawMap(); });
  on('rquit', () => { roy = null; drawMap(); });
  on('ragain', royStart);
  on('rlock', openLocker);
  on('ropen', () => { roy.opened = true; openPack(roy.reward.tier, drawMap); });
}
let galKind = 'skin';
function openLocker() {
  let ov = $('lockerOv'); if (!ov) { ov = document.createElement('div'); ov.id = 'lockerOv'; ov.className = 'locker en'; ov.dir = 'ltr'; document.body.appendChild(ov); }
  const price = 300, total = ITEMS.length, have = ITEMS.filter(x => locker.has(x.id)).length;
  const ms = MILESTONES.map(([n, t]) => {
    const st = claimed.has(n) ? 'done' : have >= n ? 'ready' : 'lock';
    return `<button class="ms ${st}" data-ms="${n}" style="--rc:${RAR[t].col}" ${st === 'ready' ? '' : 'disabled'}>${st === 'done' ? '✅' : st === 'ready' ? '🎁' : '🔒'}<b>${n}</b><small>${RAR[t].en}</small></button>`;
  }).join('');
  const mine = ITEMS.filter(x => x.kind === galKind);
  ov.innerHTML = `<div class="lk"><div class="lkh"><h2>🏆 COLLECTION</h2><button class="back-btn" id="lkx">✕ Close</button></div>
    <div class="gtot"><div class="gbar"><i style="width:${have / total * 100}%"></i></div><p>Collected <b>${have}</b> / <b>${total}</b> • 🪙 <b>${coins}</b> GeoCoins • Best match ⭐ ${royBest} XP</p></div>
    <h3 style="color:#ffd66b">🎯 COLLECTION REWARDS — collect more, get free packs</h3><div class="msrow">${ms}</div>
    <button class="btn royale" id="lkbuy" ${coins < price ? 'disabled style="opacity:.5"' : ''}>🛒 ITEM SHOP: Rare Pack — ${price} 🪙</button>
    <details class="backup"><summary>💾 SAVE / LOAD PROGRESS — keep your prizes safe</summary>
      <p>Copy your <b>save code</b> and keep it (WhatsApp it to yourself). On a new iPad or browser, paste it here and tap LOAD.</p>
      <div class="bkrow"><button class="btn nav" id="bksave">💾 SAVE CODE</button><button class="btn good" id="bkload">📥 LOAD CODE</button></div>
      <textarea id="bkcode" rows="3" placeholder="Your save code appears here — or paste a code to load"></textarea><div id="bkmsg"></div></details>
    <div class="ktabs">${KINDS.map(k => { const n = ITEMS.filter(x => x.kind === k.id && locker.has(x.id)).length;
      return `<button class="chip" data-gk="${k.id}" aria-pressed="${k.id === galKind}">${k.emo} ${k.name} ${n}/20</button>`; }).join('')}</div>
    ${[...ORDER].reverse().map(t => `<h3 style="color:${RAR[t].col}">${RAR[t].en.toUpperCase()}</h3><div class="lkg">${mine.filter(x => x.r === t).map(x => locker.has(x.id)
      ? `<button class="lkb${loadout[x.kind] === x.id ? ' eq' : ''}" data-it="${x.id}">${itemCard(x, true)}<span>${loadout[x.kind] === x.id ? '✅ EQUIPPED' : 'EQUIP'}</span></button>`
      : `<div class="lkb lockd" style="background:${RAR[t].bg}">🔒<span>???</span></div>`).join('')}</div>`).join('')}</div>`;
  ov.hidden = false;
  $('lkx').onclick = () => { ov.hidden = true; drawMap(); };
  ov.querySelectorAll('[data-gk]').forEach(b => b.onclick = () => { galKind = b.dataset.gk; openLocker(); });
  ov.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { const x = item(b.dataset.it); loadout[x.kind] = x.id; store.set('loadout', loadout); openLocker(); });
  ov.querySelectorAll('.ms.ready').forEach(b => b.onclick = () => {
    const n = +b.dataset.ms, t = MILESTONES.find(m => m[0] === n)[1]; claimed.add(n); store.set('claimed', [...claimed]);
    ov.hidden = true; openPack(t, openLocker);
  });
  $('bksave').onclick = () => {
    const data = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('geo-')) data[k] = localStorage.getItem(k); } } catch (e) {}
    const code = 'GEO1:' + btoa(unescape(encodeURIComponent(JSON.stringify(data)))); const ta = $('bkcode'); ta.value = code; ta.select();
    const done = () => { $('bkmsg').textContent = '✅ Code copied! Keep it somewhere safe.'; };
    try { navigator.clipboard.writeText(code).then(done, () => { $('bkmsg').textContent = '👆 Select the code and copy it.'; }); } catch (e) { $('bkmsg').textContent = '👆 Select the code and copy it.'; }
  };
  $('bkload').onclick = () => {
    const v = $('bkcode').value.trim();
    try {
      if (!v.startsWith('GEO1:')) throw 0;
      const data = JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));
      Object.entries(data).forEach(([k, val]) => { if (k.startsWith('geo-')) localStorage.setItem(k, val); });
      $('bkmsg').textContent = '✅ Loaded! Restarting…'; setTimeout(() => location.reload(), 700);
    } catch (e) { $('bkmsg').textContent = '❌ That code doesn\'t look right. Paste the whole code that starts with GEO1:'; }
  };
  $('lkbuy').onclick = () => { if (coins < price) return; coins -= price; store.set('coins', coins); ov.hidden = true; openPack('r', openLocker); };
}

renderChips(); setTab(['map', 'exam', 'play'].includes(store.get('tab', 'map')) ? store.get('tab', 'map') : 'map');
</script>
